name: Build ShazamSync iOS 26 App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build Unsigned iOS 26 IPA (Liquid Glass + Dynamic Island)
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app
          for v in 26.4 26.3 26.2 26.1.1 26.1 26.0.1 26.0; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              echo "Pinning Xcode $v"
              sudo xcode-select -s "/Applications/Xcode_$v.app/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build ShazamSyncApp & ShazamSyncWidgets (iOS 26 Release)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project ShazamSync.xcodeproj \
            -scheme ShazamSyncApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CLANG_ENABLE_EXPLICIT_MODULES="NO" \
            SWIFT_ENABLE_EXPLICIT_MODULES="NO" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED="NO" \
            CODE_SIGNING_ALLOWED="NO" \
            AD_HOC_CODE_SIGNING_ALLOWED="YES"

      - name: Package Unsigned IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "ShazamSyncApp.app" -type d | head -n 1)
          echo "Found built app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r9 ShazamSync-iOS26.ipa Payload
          ls -lh ShazamSync-iOS26.ipa

      - name: Upload ShazamSync-iOS26.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShazamSync-iOS26-IPA
          path: ShazamSync-iOS26.ipa
          if-no-files-found: error
          retention-days: 30
